server.port=8081
spring.application.name=user-service

# Own MySQL database: CREATE DATABASE userdb;
spring.datasource.url=jdbc:mysql://localhost:3306/userdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Signs the tokens. It MUST be identical to security.jwt.secret in the Product, Cart and Order services.
# HS256 needs at least 32 characters.
security.jwt.secret=change-me-change-me-change-me-1234
# how long a token stays valid
security.jwt.expiration-minutes=60

# First SUPER_ADMIN, created at startup if that email does not exist yet
app.super-admin.name=Super Admin
app.super-admin.email=superadmin@shopsphere.com
app.super-admin.password=Admin@12345
