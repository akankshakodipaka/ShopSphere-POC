# ---------- Application ----------
spring.application.name=OrderService
server.port=8084

# ---------- MySQL (create the database first: CREATE DATABASE orderdb;) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/orderdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Swagger UI (one page for both services) ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.urls-primary-name=Order Service

springdoc.swagger-ui.urls[0].name=Order Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs

springdoc.swagger-ui.urls[1].name=Cart Service
springdoc.swagger-ui.urls[1].url=http://localhost:8083/v3/api-docs

springdoc.swagger-ui.urls[2].name=Product Service
springdoc.swagger-ui.urls[2].url=http://localhost:8082/v3/api-docs